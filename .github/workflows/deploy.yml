name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 不缓存 npm：仓库还没有 lockfile（P0 阶段沙箱无法本地生成）

      - name: Install dependencies
        # 用 npm install 而非 npm ci：仓库还没有 package-lock.json（P0 阶段沙箱无法本地生成）
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          BASE_PATH: /seeing-llm
          NEXT_PUBLIC_BASE_PATH: /seeing-llm
          NODE_ENV: production
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true